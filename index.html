let publicCatalog=[],catalogError='',routeVersion=0;
function readLocal(){try{const v=JSON.parse(localStorage.getItem('signal_issues_v1')||'[]');return Array.isArray(v)?v.filter(validIssue):[]}catch{return []}}
function validIssue(i){return i&&typeof i==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(i.date)&&!isNaN(Date.parse(i.date))&&new Date(i.date).toISOString().slice(0,10)===i.date&&typeof i.markdown==='string'&&typeof i.title==='string'}
let issues=[];
function refresh(){const merged=new Map(readLocal().map(i=>[i.date,{...i,isPublic:false}]));publicCatalog.forEach(i=>merged.set(i.date,i));issues=[...merged.values()].sort((a,b)=>b.date.localeCompare(a.date))}
function cacheCatalog(){try{localStorage.setItem('signal_public_cache_v2',JSON.stringify(publicCatalog))}catch{}}
async function loadCatalog(){try{const r=await fetch('content/index.json',{cache:'no-cache'});if(!r.ok)throw new Error();const data=await r.json();if(data.schema_version!==1||!Array.isArray(data.issues))throw new Error();let cached=[];try{cached=JSON.parse(localStorage.getItem('signal_public_cache_v2')||'[]')}catch{}publicCatalog=data.issues.filter(i=>/^\d{4}-\d{2}-\d{2}$/.test(i.date)&&i.file==='issues/'+i.date+'.md'&&typeof i.title==='string'&&/^[a-f0-9]{64}$/.test(i.sha256)).map(i=>({...i,markdown:cached.find(old=>old.date===i.date&&old.sha256===i.sha256)?.markdown||'',isPublic:true}));if(publicCatalog.length!==data.issues.length)throw new Error();cacheCatalog()}catch{catalogError='公开档案暂时无法加载。请刷新重试；如有缓存，将展示上次成功读取的资料。';try{publicCatalog=JSON.parse(localStorage.getItem('signal_public_cache_v2')||'[]').filter(i=>validIssue(i)&&i.isPublic===true)}catch{publicCatalog=[]}}refresh();const latest=currentIssues()[0];if(latest)try{await loadIssue(latest.date)}catch{}}
async function loadIssue(date){const issue=publicCatalog.find(i=>i.date===date);if(!issue||issue.markdown)return issue;const r=await fetch('content/'+issue.file,{cache:'no-cache'});if(!r.ok)throw new Error('读取正文失败');const text=(await r.text()).replace(/\r\n/g,'\n');if(crypto.subtle){const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))).map(b=>b.toString(16).padStart(2,'0')).join('');if(digest!==issue.sha256)throw new Error('档案正文校验失败')}const m=text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);if(!m)throw new Error('档案格式错误');const meta=JSON.parse(m[1]);if(meta.date!==date)throw new Error('档案日期不符');issue.markdown=m[2];cacheCatalog();refresh();return issue}

function topicsPage(){return `<div class="wrap"><div class="page-head"><span class="eyebrow">RESEARCH INDEX / 09</span><h1>研究专题 <span style="color:var(--green-dark)">/ 09</span></h1><p>跨越经济、科技、设计与生活。每个专题都能单独积累资料，并从每日简报中提取可持续学习的方法。</p></div><div class="section"><div class="topic-page-grid">${TOPICS.map(card).join('')}</div></div></div>`}
function mdInline(t){let s=esc(t);s=s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,(_,alt,u)=>`<img src="${esc(validUrl(u))}" alt="${esc(alt)}" loading="lazy">`);s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,v,u)=>`<a href="${esc(validUrl(u))}" target="_blank" rel="noopener noreferrer">${v}</a>`);s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');return s}
function mdRender(s){if(!s)return '<p>暂无正文</p>';const lines=String(s).replace(/\r\n/g,'\n').split('\n');let out='',list=false,kind='',code=false,codes=[];function closeList(){if(list){out+=`</${kind}>`;list=false;kind=''}};for(let i=0;i<lines.length;i++){let raw=lines[i],l=raw.trim();if(/^```/.test(l)){closeList();if(!code){code=true;codes=[]}else{out+=`<pre><code>${esc(codes.join('\n'))}</code></pre>`;code=false}continue}if(code){codes.push(raw);continue}if(!l){closeList();continue}const head=l.match(/^(#{1,5})\s+(.+)$/);if(head){closeList();let n=Math.min(4,head[1].length);out+=`<h${n}>${mdInline(head[2])}</h${n}>`;continue}if(/^---+$/.test(l)){closeList();out+='<hr>';continue}if(/^\|.*\|$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){closeList();let rows=[l];i+=2;while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(lines[i].trim());i++}i--;const cells=x=>x.replace(/^\||\|$/g,'').split('|').map(v=>v.trim());out+='<table><thead><tr>'+cells(rows[0]).map(c=>`<th>${mdInline(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+cells(row).map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue}if(/^>/.test(l)){closeList();out+=`<blockquote>${mdInline(l.replace(/^>\s*/,''))}</blockquote>`;continue}let m=l.match(/^[-*+]\s+(.+)$/),ord=l.match(/^\d+[.)]\s+(.+)$/);if(m||ord){const typ=m?'ul':'ol';if(list&&kind!==typ)closeList();if(!list){list=true;kind=typ;out+=`<${typ}>`}out+=`<li>${mdInline((m||ord)[1])}</li>`;continue}closeList();out+=`<p>${mdInline(l)}</p>`}closeList();if(code)out+=`<pre>${esc(codes.join('\n'))}</pre>`;return out}
function contentItem(a,i,slug){return `<article class="article" id="item-${i}"><div class="article-meta"><span class="eyebrow">${esc(a.tag)}</span><span>资料 / 学习案例</span></div>${slug==='artists'?`<div class="art-visual" role="img" aria-label="作品图片未授权展示，使用抽象图形代替"><b>${i%2?'◌':'◎'}</b></div>`:''}<h2>${esc(a.title)}</h2><div class="markdown">${mdRender(a.body)}</div>${a.source?`<p style="border-top:1px solid var(--line);padding-top:15px;margin-top:22px"><span class="small subtle">REFERENCE / 原始资料</span><br><a class="source" href="${esc(validUrl(a.source))}" target="_blank" rel="noopener noreferrer">${esc(a.label||'查看来源')} ↗</a></p>`:`<p class="small subtle">${esc(a.label||'教学内容；示例数字与情景不代表真实市场数据。')}</p>`}</article>`}

function generateTradeLink(){
 const reporter=$('#tradeReporter').value,partner=$('#tradePartner').value,flow=$('#tradeFlow').value,freq=$('#tradeFrequency').value;
 const period=$('#tradePeriod').value.trim(),cmd=$('#tradeHs').value.trim().toUpperCase()||'TOTAL';
 if(!((freq==='A'&&/^\d{4}$/.test(period))||(freq==='M'&&/^\d{6}$/.test(period)&&Number(period.slice(4))>=1&&Number(period.slice(4))<=12))||!/^(TOTAL|[0-9]{2,6})$/.test(cmd)){$('#tradeFeedback').textContent='请填4位年度或6位年月（如202608）；商品代码填写TOTAL或2–6位HS数字。';return;}
 const url=new URL('https://comtradeapi.un.org/public/v1/preview/C/'+freq+'/HS');
 for(const [k,v] of Object.entries({flowCode:flow,reporterCode:reporter,partnerCode:partner,period,cmdCode:cmd}))url.searchParams.set(k,v);
 const link=$('#tradeGenerated');link.href=url.toString();link.textContent='打开 UN Comtrade 官方查询结果 ↗';
 $('#tradeFeedback').textContent='已生成实时查询链接：数据由联合国接口提供，不是网站自有数据库。若没有结果，请尝试更早的月份或年度，或检查该国商品编码与上报时间。';
}

function archiveCards(arr){if(!arr.length)return `<div class="empty-issue"><div><h3>暂时没有已导入的刊期</h3><p>历史新闻不会凭空补写。请使用「导入日报」保存你真实收到的 ChatGPT 原文。</p></div>${mainBtn('#/editor','导入日报 ↗')}</div>`;return arr.map(x=>`<a class="archive-item" href="#/issue/${esc(x.date)}"><time class="mono">${esc(x.date)}</time><div><h3>${esc(x.title||'全球信息雷达')}</h3><span class="small subtle">${x.verified?'已人工检查':'待核验整理稿'}</span><p>${esc((x.markdown||x.excerpt||'').slice(0,75))}…</p></div><span class="pill">阅读 ↗</span></a>`).join('')}
function issuePage(date){let issue=issues.find(x=>x.date===date&&x.status!=='draft');if(!issue)return notFound();return `<div class="wrap"><div class="page-head"><div class="eyebrow">SIGNAL DAILY / ${esc(date)}</div><h1>${esc(issue.title||'全球信息雷达 · 完整版')}</h1><p>归档日期：${esc(displayDate(date))} · 内容来源：${issue.origin==='openai-api-independent'?'独立OpenAI API':issue.isPublic?'原始档案 / 人工导入':'本机草稿预览'} · 发布：${esc(issue.published_at||issue.date)} · 状态：${issue.verified?'原始人工检查记录':'未经人工逐条核验'}</p><div class="issue-controls" style="margin-top:23px">${mainBtn('#/archive','← 返回档案','secondary')}<button class="btn" id="shareIssue">分享 / 复制链接 ↗</button></div></div><section class="section"><div class="issue-content"><div class="notice warning" style="margin-bottom:23px">本期内容来源于导入的文本，不代表网站已独立验证全部新闻。请以各原始资料及政府正式文件为准。</div><div class="article markdown">${mdRender(issue.markdown)}${issue.sources?.length?`<h2>来源清单与检查记录</h2><ul>${issue.sources.map(source=>`<li><a href="${esc(validUrl(source.url))}" target="_blank" rel="noopener noreferrer">${esc(source.title)}</a> · ${esc(source.published_date||'原稿未记录报道日期')} · ${source.check_status==='link-and-date-checked'?'链接与日期已自动检查，事实仍待核验':'未完成自动来源检查'}</li>`).join('')}</ul>`:''}</div><div class="split"><span class="small subtle">阅读完毕 · SIGNAL / 全球信息雷达</span>${mainBtn('#/topics','继续专题研究 ↗','secondary')}</div></div></section></div>`}
function about(){return `<div class="wrap"><div class="page-head"><div class="eyebrow">THE METHOD / ABOUT SIGNAL</div><h1>关于 SIGNAL</h1><p>一套为长期学习和有依据的判断而设计的每日全球信息档案。</p></div><section class="section"><div class="legal"><h3>01 / 信源与事实</h3><p>新闻原则上追踪北京时间09:00之前24—48小时的事件，分别标明事件日期和报道日期。不编造来源、数字、引述或政策。历史艺术与建筑案例可以超过48小时，但必须标示原始年份与资料出处。</p><h3>02 / 观点与不确定性</h3><p>事实、评论、长期情景和教学演示分开标示。教学示例的数字不等于真实市场数据。所有医药医保政策请核对发布机关、文号、施行时间、适用地区和正式原文。</p><h3>03 / 数据与自动化</h3><p>本版部署在 GitHub Pages 的静态网页中。浏览器本机编辑并非在线云数据库，也不与 ChatGPT Tasks 自动同步。公开正文按日期存放于 content/issues，GitHub Actions 在配置授权与API Key后可独立生成和发布。现有ChatGPT Tasks没有与本站同步；原报告可通过手动Markdown导入流程发布。</p><h3>04 / 安全与隐私</h3><p>编辑器仅将手动输入内容保存到当前浏览器 localStorage。任何访问者理论上都可以编辑其自己的本机副本，却无法直接改动服务器公开内容；本版本没有管理员账号或云端读写权限，请勿在网页或上传文件中写入密码、API密钥和私人数据。</p><h3>05 / 免责声明</h3><p>网站资料用于一般信息、研究和教育，不构成投资建议、医疗诊断或药房合规法律意见。重大决定请查阅专业机构原文并咨询相应专业人士。</p></div></section></div>`}
let editorState={date:curDate(),title:'SIGNAL｜全球信息雷达·完整版',markdown:'',verified:false,publicExport:false};let editorPreview=false;
function editor(){return `<div class="wrap"><div class="page-head"><div class="eyebrow">PUBLISHING STUDIO / LOCAL EDITOR</div><h1>内容编辑与发布</h1><p>把每天09:00的完整版简报完整复制进来。保存后可以在当前浏览器预览；要公开发布，请导出Markdown并补齐来源元数据，再通过GitHub Actions手动导入。</p></div><section class="section"><div class="notice warning"><strong>重要：这不是在线管理后台。</strong> 访客在这里的编辑只保存于其自己的设备，不会改变已公开的网站。任何人都无法通过此页面直接修改托管服务器上的文件。不要粘贴密码或敏感数据。</div><div class="form-grid" style="margin-top:24px"><div class="field"><label for="issueDate">刊期日期（北京时间）</label><input id="issueDate" type="date" value="${esc(editorState.date)}"></div><div class="field"><label for="issueTitle">刊期标题</label><input id="issueTitle" type="text" value="${esc(editorState.title)}" placeholder="SIGNAL｜全球信息雷达·完整版"></div></div><div class="field" style="margin-top:17px"><label for="issueMarkdown">完整简报正文（Markdown 或纯文本）</label><textarea id="issueMarkdown" placeholder="# 今日世界速览\n\n在这里粘贴当天简报的全部内容。可以包含原始资料链接、新闻、9个专题、经济与艺术等公开资料。请勿输入家庭医药私人内容。" style="min-height:345px">${esc(editorState.markdown)}</textarea></div><div class="notice warning" style="margin-top:18px"><label><input type="checkbox" id="publicExport" ${editorState.publicExport?'checked':''}> 我已审阅本刊期，确认可公开且不含家庭医药私人内容，允许导出公开Markdown。</label><p>默认仅本机保存；仅当前已保存且明确允许公开的刊期可导出Markdown。公开历史档案不能在此覆盖。JSON 备份含全部本机内容，仅供私人保管，切勿上传公开仓库。</p></div><div class="row-actions"><button class="btn" id="previewBtn">预览正文</button><button class="btn green" id="saveBtn">保存到此浏览器</button><button class="btn secondary" id="exportBtn">导出公开 Markdown</button><button class="btn ghost" id="backupBtn">下载 JSON 备份 ↧</button></div><div class="field" style="margin-top:17px"><label style="display:flex;align-items:center;gap:9px;font-size:12px;font-weight:400"><input type="checkbox" id="verified" style="width:auto" ${editorState.verified?'checked':''}> 我已人工检查原始信源、关键日期与高风险政策信息（仅记录检查状态）</label></div><div style="margin-top:26px;border-top:1px solid var(--line);padding-top:23px"><h3>本机已保存的刊期</h3><div class="archived" id="localIssues">${issues.length?issues.map(x=>`<div class="archive-item"><time>${esc(x.date)}</time><div><strong>${esc(x.title)}</strong><div class="small subtle">${x.verified?'已人工检查':'待核查'} · ${x.markdown.length} 字符</div></div><button class="chip" data-edit="${esc(x.date)}">编辑</button></div>`).join(''):'<p class="subtle">暂无本机刊期</p>'}</div></div><div class="notice" style="margin-top:25px"><strong>免费发布步骤：</strong>① 保存本机草稿；② 明确公开授权并保存；③ 导出Markdown，按发布指南补齐来源日期与19个章节；④ GitHub Actions手动选择import并先模拟验证。验证通过后正式导入；同日期已有文章不会被覆盖。详见仓库 docs/AUTOMATION.md。</div>${editorPreview?`<div class="preview-area"><div class="eyebrow">PREVIEW / 当前编辑内容</div><h2>${esc(editorState.title)}</h2><div class="markdown">${mdRender(editorState.markdown)}</div></div>`:''}</section></div>`}
function notFound(){return `<div class="wrap section"><div class="eyebrow">404 / NOT FOUND</div><h1 class="section-title">没有找到对应内容</h1><p class="subtle">可能尚未导入或该刊期尚未发布。</p>${mainBtn('#/','返回首页','secondary')}</div>`}
async function route(){const version=++routeVersion;let raw;try{raw=decodeURIComponent(location.hash.slice(1)||'/')}catch{raw='/invalid'}if(raw==='main-content'){$('#app').focus();return}const [h,query='']=raw.split('?');window.scrollTo({top:0,left:0,behavior:'instant'});let issueError=false;if(h.startsWith('/issue/'))try{await loadIssue(h.split('/')[2])}catch{issueError=true}if(version!==routeVersion)return;let html;if(issueError)html='<div class="wrap section"><h1>正文暂时无法加载</h1><p>请刷新重试。历史档案仍保存在仓库中。</p><a class="btn" href="#/archive">返回档案</a></div>';else if(h==='/')html=home();else if(h==='/topics')html=topicsPage();else if(h==='/archive')html=archive();else if(h==='/healthcare')html=healthcare();else if(h==='/editor')html=editor();else if(h==='/about')html=about();else if(h.startsWith('/topic/'))html=topicPage(h.split('/')[2]==='art'?'artists':h.split('/')[2]);else if(h.startsWith('/issue/'))html=issuePage(h.split('/')[2]);else html=notFound();$('#app').innerHTML=(catalogError?`<div class="wrap notice warning" role="status">${esc(catalogError)}</div>`:'')+html;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+h||(h.startsWith('/topic/')&&a.dataset.nav==='topics')));$('#mobileNav').classList.remove('open');$('#menuToggle').setAttribute('aria-expanded','false');wire();const item=new URLSearchParams(query).get('item');if(item!==null&&/^\d+$/.test(item))document.getElementById('item-'+item)?.scrollIntoView();const heading=$('#app h1');document.title=(heading?heading.textContent+'｜':'')+'SIGNAL｜全球信息雷达｜Global Intelligence Radar｜グローバル情報レーダー';$('#app').focus({preventScroll:true})}
function syncEditor(){if(!$('#issueDate'))return;editorState.date=$('#issueDate').value;editorState.title=$('#issueTitle').value;editorState.markdown=$('#issueMarkdown').value;editorState.verified=$('#verified').checked;editorState.publicExport=$('#publicExport').checked}
function toast(s){const e=$('#toast');e.textContent=s;e.hidden=false;clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.hidden=true,3300)}
function download(name,body,type='text/html;charset=utf-8'){let b=new Blob([body],{type});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function persist(){try{localStorage.setItem('signal_issues_v1',JSON.stringify(issues.filter(i=>!i.isPublic)));return true}catch{toast('浏览器存储失败，请下载JSON备份并私人保管');return false}}
function exportHtml(){syncEditor();const saved=issues.find(i=>i.date===editorState.date&&!i.isPublic);if(!saved||!saved.publicExport||['title','markdown','verified','publicExport'].some(k=>saved[k]!==editorState[k])){toast('请保存本机草稿并明确勾选公开授权后再导出');return}const issue={schema_version:1,date:saved.date,title:saved.title,status:'published',published_at:new Date().toISOString(),verification:'unverified',verified:false,public_approved:true,complete:false,origin:'manual-import',sources:[],markdown:saved.markdown};const {markdown,...meta}=issue;download(saved.date+'.md','---\n'+JSON.stringify(meta,null,2)+'\n---\n'+markdown,'text/markdown;charset=utf-8');toast('已导出Markdown草稿；需补齐来源、章节与complete声明，通过检查后才能发布')}

function wire(){if($('#tradeGenerate'))$('#tradeGenerate').onclick=generateTradeLink;if($('#menuToggle'))$('#menuToggle').onclick=()=>{let nav=$('#mobileNav');nav.classList.toggle('open');$('#menuToggle').setAttribute('aria-expanded',String(nav.classList.contains('open')))};document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{govRegion=b.dataset.region;route()});if($('#archiveSearch')){let searchVersion=0;$('#archiveSearch').oninput=async e=>{const n=++searchVersion,q=e.target.value.toLowerCase();if(q)await Promise.allSettled(currentIssues().map(i=>loadIssue(i.date)));if(n!==searchVersion||!$('#archiveResults'))return;$('#archiveResults').innerHTML=archiveCards(currentIssues().filter(i=>(i.date+' '+i.title+' '+(i.markdown||i.excerpt)).toLowerCase().includes(q)))}};if($('#shareIssue'))$('#shareIssue').onclick=async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:document.title,url});else if(navigator.clipboard)await navigator.clipboard.writeText(url);else throw new Error();toast('已打开分享或复制链接')}catch(e){if(e.name==='AbortError')return;toast('无法自动复制，可手动复制浏览器地址')}};if($('#previewBtn'))$('#previewBtn').onclick=()=>{syncEditor();editorPreview=true;route()};if($('#saveBtn'))$('#saveBtn').onclick=()=>{syncEditor();if(!validIssue(editorState)||!editorState.markdown.trim()){toast('请填写正确日期并粘贴完整正文');return}if(publicCatalog.some(x=>x.date===editorState.date)){toast('该日期已有公开档案，不能覆盖；请使用新日期或提交更正说明');return}issues=issues.filter(x=>x.date!==editorState.date);issues.unshift({...editorState,status:'published',isPublic:false,updated_at:new Date().toISOString()});issues.sort((a,b)=>b.date.localeCompare(a.date));if(!persist())return;toast('已保存本机；公开导出前请核对授权范围');route()};if($('#exportBtn'))$('#exportBtn').onclick=exportHtml;if($('#backupBtn'))$('#backupBtn').onclick=()=>download('signal-issues-backup.json',JSON.stringify(issues.filter(i=>!i.isPublic),null,2),'application/json;charset=utf-8');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=issues.find(y=>y.date===b.dataset.edit);if(x){editorState={date:x.date,title:x.title,markdown:x.markdown,verified:x.verified,publicExport:x.publicExport===true};editorPreview=false;route();toast('已载入该刊期供编辑')}})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#mobileNav').classList.remove('open');$('#menuToggle').setAttribute('aria-expanded','false');$('#menuToggle').focus()}});window.addEventListener('hashchange',()=>{syncEditor();route()});loadCatalog().then(()=>route());
</script>
</body>
</html>
