政策无变化。** 请查阅[国家药监局](https://www.nmpa.gov.cn/)与[国家医保局](https://www.nhsa.gov.cn/)，并关注辽宁、吉林、黑龙江省级官方发布。应区分发文日期、实施日期、适用地区和征求意见状态。\n\n### 06 建筑、城市与设计\n研究方向：城市更新中空间设计与项目实施能力之间的关系。**本期完整项目资料待补录。**\n\n### 07 全球重要变化与长期趋势\n研究方向：能源电网容量如何影响新能源与AI基础设施扩张。**具体预测数字待原始来源核实。**\n\n## 05｜今日认知拓展\n**局部最优不等于整体最优。** 例如，增加太阳能设备但不升级电网，新增装机未必完全转化为有效供电。个人项目管理同理，增加项目数量不一定增加成果。\n\n## 06｜延伸阅读与原始资料入口\n- [IRENA 国际可再生能源署](https://www.irena.org/)\n- [国家统计局](https://www.stats.gov.cn/)\n- [Christina Kubisch — Electrical Walks](https://christinakubisch.de/electrical-walks)\n- [Public Art Fund — Wheatfields for Manhattan](https://www.publicartfund.org/exhibitions/view/wheatfields-for-manhattan/)\n\n**刊期状态：待核验的整理稿。请勿将其当作完成新闻事实核验的正式发布版本。**\n", "verified": false, "status": "published", "updated_at": "2026-10-28T09:00:00+08:00", "edition_note": "待核验整理稿"}, {"date": "2026-10-27", "title": "SIGNAL｜历史刊期 27 Oct｜過去の号", "markdown": "# 历史刊期待补录\n\n该日期的完整原始简报尚未取得。这里仅建立档案位置，不代表已核验或发布任何新闻。", "verified": false, "status": "draft"}, {"date": "2026-10-26", "title": "SIGNAL｜历史刊期 26 Oct｜過去の号", "markdown": "# 历史刊期待补录\n\n该日期的完整原始简报尚未取得。这里仅建立档案位置，不代表已核验或发布任何新闻。", "verified": false, "status": "draft"}, {"date": "2026-10-25", "title": "SIGNAL｜历史刊期 25 Oct｜過去の号", "markdown": "# 历史刊期待补录\n\n该日期的完整原始简报尚未取得。这里仅建立档案位置，不代表已核验或发布任何新闻。", "verified": false, "status": "draft"}, {"date": "2026-10-24", "title": "SIGNAL｜历史刊期 24 Oct｜過去の号", "markdown": "# 历史刊期待补录\n\n该日期的完整原始简报尚未取得。这里仅建立档案位置，不代表已核验或发布任何新闻。", "verified": false, "status": "draft"}]</script>

<section class="section"><div class="wrap">${sectionHeading('DAILY EDITION','今日全球简报','保留完整正文、来源与研究内容；不将未经审核的新闻作为已确认事实。')}${latest?`<div class="empty-issue"><div><span class="eyebrow">LATEST ISSUE / ${esc(latest.date)}</span><h3>${esc(latest.title||'全球信息雷达')}</h3><p>已导入，可阅读完整正文与来源链接。</p></div>${mainBtn('#/issue/'+latest.date,'打开全文 ↗')}</div>`:`<div class="empty-issue"><div><span class="eyebrow">AWAITING FIRST ISSUE</span><h3>今天的完整简报尚待导入</h3><p>当前不展示假新闻。你可以把每天09:00的ChatGPT全文贴入编辑器，保存并导出更新后的网页。</p></div>${mainBtn('#/editor','导入第一期 ↗')}</div>`}</div></section>
<section class="dark-section"><div class="wrap">${sectionHeading('10 GLOBAL FIELDS','十大全球观察领域','一页了解今日世界，重要事件进入完整刊期并保留原始来源。')}<div class="domains">${DOMAINS.map((d,i)=>`<div class="domain"><span class="n mono">${String(i+1).padStart(2,'0')}</span><strong>${esc(d)}</strong><span style="margin-left:auto">↗</span></div>`).join('')}</div></div></section>
<section class="section"><div class="wrap">${sectionHeading('7 RESEARCH VERTICALS','七大深度专题','从新闻中提炼知识、方法与可以持续追踪的判断。')}<div class="topic-grid">${TOPICS.map(card).join('')}</div></div></section>

function topicsPage(){return `<div class="wrap"><div class="page-head"><span class="eyebrow">RESEARCH INDEX / 07</span><h1>研究专题 <span style="color:var(--green-dark)">/ 07</span></h1><p>跨越经济、科技、设计与生活。每个专题都能单独积累资料，并从每日简报中提取可持续学习的方法。</p></div><div class="section"><div class="topic-page-grid">${TOPICS.map(card).join('')}</div></div></div>`}
function mdInline(t){let s=esc(t);s=s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,(_,alt,u)=>`<img src="${esc(validUrl(u))}" alt="${esc(alt)}" loading="lazy">`);s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,v,u)=>`<a href="${esc(validUrl(u))}" target="_blank" rel="noopener noreferrer">${v}</a>`);s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');return s}
function mdRender(s){if(!s)return '<p>暂无正文</p>';const lines=String(s).replace(/\r\n/g,'\n').split('\n');let out='',list=false,kind='',code=false,codes=[];function closeList(){if(list){out+=`</${kind}>`;list=false;kind=''}};for(let i=0;i<lines.length;i++){let raw=lines[i],l=raw.trim();if(/^```/.test(l)){closeList();if(!code){code=true;codes=[]}else{out+=`<pre><code>${esc(codes.join('\n'))}</code></pre>`;code=false}continue}if(code){codes.push(raw);continue}if(!l){closeList();continue}const head=l.match(/^(#{1,5})\s+(.+)$/);if(head){closeList();let n=Math.min(4,head[1].length);out+=`<h${n}>${mdInline(head[2])}</h${n}>`;continue}if(/^---+$/.test(l)){closeList();out+='<hr>';continue}if(/^\|.*\|$/.test(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){closeList();let rows=[l];i+=2;while(i<lines.length&&lines[i].trim().startsWith('|')){rows.push(lines[i].trim());i++}i--;const cells=x=>x.replace(/^\||\|$/g,'').split('|').map(v=>v.trim());out+='<table><thead><tr>'+cells(rows[0]).map(c=>`<th>${mdInline(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+cells(row).map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';continue}if(/^>/.test(l)){closeList();out+=`<blockquote>${mdInline(l.replace(/^>\s*/,''))}</blockquote>`;continue}let m=l.match(/^[-*+]\s+(.+)$/),ord=l.match(/^\d+[.)]\s+(.+)$/);if(m||ord){const typ=m?'ul':'ol';if(list&&kind!==typ)closeList();if(!list){list=true;kind=typ;out+=`<${typ}>`}out+=`<li>${mdInline((m||ord)[1])}</li>`;continue}closeList();out+=`<p>${mdInline(l)}</p>`}closeList();if(code)out+=`<pre>${esc(codes.join('\n'))}</pre>`;return out}
function contentItem(a,i,slug){return `<article class="article" id="item-${i}"><div class="article-meta"><span class="eyebrow">${esc(a.tag)}</span><span>资料 / 学习案例</span></div>${slug==='art'?`<div class="art-visual" role="img" aria-label="作品图片未授权展示，使用抽象图形代替"><b>${i%2?'◌':'◎'}</b></div>`:''}<h2>${esc(a.title)}</h2><div class="markdown">${mdRender(a.body)}</div>${a.source?`<p style="border-top:1px solid var(--line);padding-top:15px;margin-top:22px"><span class="small subtle">REFERENCE / 原始资料</span><br><a class="source" href="${esc(validUrl(a.source))}" target="_blank" rel="noopener noreferrer">${esc(a.label||'查看来源')} ↗</a></p>`:`<p class="small subtle">教学示例，数值与情景均非真实市场数据。</p>`}</article>`}
function topicPage(slug){const t=TOPICS.find(x=>x.slug===slug);if(!t)return notFound();if(slug==='healthcare')return healthcare();const arr=CONTENT[slug]||[];const side=slug==='art'?`<div class="small subtle">ART LAB</div><a href="#item-0">A / 艺术家作品研究</a><a href="#item-2">B / 艺术认知破圈</a>`:arr.map((a,i)=>`<a href="#item-${i}">${esc(a.title)}</a>`).join('');return `<div class="wrap"><div class="page-head"><div class="eyebrow">DEEP RESEARCH / ${t.num} · ${esc(t.en)}</div><h1>${esc(t.name)}</h1><p>${esc(t.lead)}</p></div><section class="section list-layout"><div><div class="topic-lead">${esc(t.sub)}。以下为有来源的历史研究案例或教学样本，不能当作最近48小时的新消息。</div>${arr.map((x,i)=>contentItem(x,i,slug)).join('')}${slug==='economics'?`<div class="notice">后续学习路径：激励、通胀、利率、复利、货币与信用、债券、股票、估值、资产负债表、现金流、汇率、风险与央行政策。内容尚待逐期补充。</div>`:''}</div><aside class="side-card"><div class="eyebrow">INDEX</div><h3>本专题目录</h3>${side}<p>每一篇都区分资料事实、独立分析与练习。图片如未获可靠使用授权，将使用原创占位图。</p>${mainBtn('#/topics','返回全部专题','secondary')}</aside></section></div>`}
let govRegion='全部';function healthcare(){const t=TOPICS.find(x=>x.slug==='healthcare');const regs=['全部','全国','辽宁','吉林','黑龙江'];const sources=GOV_SOURCES.filter(x=>govRegion==='全部'||x.region===govRegion);return `<div class="wrap"><div class="page-head"><div class="eyebrow">DEEP RESEARCH / 05 · PHARMA POLICY</div><h1>医药 · 医保 · 药房政策</h1><p>重点关注国家药监局、国家医保局及东北辽宁、吉林、黑龙江。所有政策都应区分公布日期、施行日期、征求意见状态和实际适用地区。</p></div><section class="section"><div class="notice warning"><strong>政策信息状态：</strong>本免费版尚未自动采集实时政策，也未收录经过逐条核验的最新政策。下面展示的是官方信息入口，而非今日新增政策。任何经营决策请打开原文核实。</div><div style="margin-top:33px">${sectionHeading('OFFICIAL SOURCES','官方来源导航','选择地区筛选机构，点击进入政府官方网站查找政策原文。')}</div><div class="filterbar">${regs.map(x=>`<button class="chip ${govRegion===x?'active':''}" data-region="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="resource-list">${sources.map(x=>`<a class="resource-row" href="${esc(validUrl(x.url))}" target="_blank" rel="noopener noreferrer"><strong>${esc(x.name)} <span style="color:var(--green-dark)">↗</span></strong><span>${esc(x.region)} · ${esc(x.label)}</span></a>`).join('')}</div><div class="feature-strip"><div><div class="eyebrow">POLICY CHECKLIST</div><h2 class="section-title">不是所有政策都已生效。</h2><p class="subtle" style="max-width:520px">一条合格的政策摘要至少应包含：发文机构、文件名称和文号、发布时间、施行日期、适用地区、政策状态、原文链接、对药房经营的影响和必要的核查动作。</p></div><div class="well"><h3>持续关注的经营主题</h3><p>药店许可与GSP、执业药师、医保定点与门诊统筹、个人账户、双通道、电子处方、药品追溯与网络售药、集采、抽检与召回。</p></div></div></section></div>`}

function issuePage(date){let issue=issues.find(x=>x.date===date&&x.status!=='draft');if(!issue)return notFound();return `<div class="wrap"><div class="page-head"><div class="eyebrow">SIGNAL DAILY / ${esc(date)}</div><h1>${esc(issue.title||'全球信息雷达 · 完整版')}</h1><p>归档日期：${esc(displayDate(date))} · 内容来源：人工导入 · 状态：${issue.verified?'已人工检查':'待逐条核查来源'}</p><div class="issue-controls" style="margin-top:23px">${mainBtn('#/archive','← 返回档案','secondary')}<button class="btn" id="shareIssue">分享 / 复制链接 ↗</button></div></div><section class="section"><div class="issue-content"><div class="notice warning" style="margin-bottom:23px">本期内容来源于导入的文本，不代表网站已独立验证全部新闻。请以各原始资料及政府正式文件为准。</div><div class="article markdown">${mdRender(issue.markdown)}</div><div class="split"><span class="small subtle">阅读完毕 · SIGNAL / 全球信息雷达</span>${mainBtn('#/topics','继续专题研究 ↗','secondary')}</div></div></section></div>`}
function about(){return `<div class="wrap"><div class="page-head"><div class="eyebrow">THE METHOD / ABOUT SIGNAL</div><h1>关于 SIGNAL</h1><p>一套为长期学习和有依据的判断而设计的每日全球信息档案。</p></div><section class="section"><div class="legal"><h3>01 / 信源与事实</h3><p>新闻原则上追踪北京时间09:00之前24—48小时的事件，分别标明事件日期和报道日期。不编造来源、数字、引述或政策。历史艺术与建筑案例可以超过48小时，但必须标示原始年份与资料出处。</p><h3>02 / 观点与不确定性</h3><p>事实、评论、长期情景和教学演示分开标示。教学示例的数字不等于真实市场数据。所有医药医保政策请核对发布机关、文号、施行时间、适用地区和正式原文。</p><h3>03 / 数据与自动化</h3><p>本版部署在 GitHub Pages 的静态网页中。浏览器本机编辑并非在线云数据库，也不与 ChatGPT Tasks 自动同步。管理员通过导出完整网页并重新上传到托管平台来发布新一期。未来可以通过 GitHub Actions 与独立数据接口实现更高程度的自动化，但可能涉及额外配置与使用成本。</p><h3>04 / 安全与隐私</h3><p>编辑器仅将手动输入内容保存到当前浏览器 localStorage。任何访问者理论上都可以编辑其自己的本机副本，却无法直接改动服务器公开内容；本版本没有管理员账号或云端读写权限，请勿在网页或上传文件中写入密码、API密钥和私人数据。</p><h3>05 / 免责声明</h3><p>网站资料用于一般信息、研究和教育，不构成投资建议、医疗诊断或药房合规法律意见。重大决定请查阅专业机构原文并咨询相应专业人士。</p></div></section></div>`}

div><div class="notice" style="margin-top:25px"><strong>免费发布步骤：</strong>① 保存到本机；② 点击「导出 GitHub Pages 网页」；③ 在 GitHub 仓库中替换根目录的 index.html 并提交修改；GitHub Pages 将重新发布网站。发布后的读者只会看到已导出的内容。日后可以再接自动同步。</div>${editorPreview?`<div class="preview-area"><div class="eyebrow">PREVIEW / 当前编辑内容</div><h2>${esc(editorState.title)}</h2><div class="markdown">${mdRender(editorState.markdown)}</div></div>`:''}</section></div>`}
function notFound(){return `<div class="wrap section"><div class="eyebrow">404 / NOT FOUND</div><h1 class="section-title">没有找到对应内容</h1><p class="subtle">可能尚未导入或该刊期尚未发布。</p>${mainBtn('#/','返回首页','secondary')}</div>`}
function route(){const h=decodeURIComponent(location.hash.slice(1)||'/').split('?')[0];window.scrollTo({top:0,left:0,behavior:'instant'});let html;if(h==='/')html=home();else if(h==='/topics')html=topicsPage();else if(h==='/archive')html=archive();else if(h==='/healthcare')html=healthcare();else if(h==='/editor')html=editor();else if(h==='/about')html=about();else if(h.startsWith('/topic/'))html=topicPage(h.split('/')[2]);else if(h.startsWith('/issue/'))html=issuePage(h.split('/')[2]);else html=notFound();$('#app').innerHTML=html;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+h||(h.startsWith('/topic/')&&a.dataset.nav==='topics')));$('#mobileNav').classList.remove('open');$('#menuToggle').setAttribute('aria-expanded','false');wire()}
function syncEditor(){if(!$('#issueDate'))return;editorState.date=$('#issueDate').value;editorState.title=$('#issueTitle').value;editorState.markdown=$('#issueMarkdown').value;editorState.verified=$('#verified').checked}
function toast(s){const e=$('#toast');e.textContent=s;e.hidden=false;clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.hidden=true,3300)}
function download(name,body,type='text/html;charset=utf-8'){let b=new Blob([body],{type});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function persist(){try{localStorage.setItem('signal_issues_v1',JSON.stringify(issues));return true}catch{toast('浏览器存储失败，请立即导出 HTML 保存');return false}}
function exportHtml(){syncEditor();if(!issues.length){toast('还没有保存刊期，仍可导出初始网站')}const clone=document.documentElement.cloneNode(true);const embed=clone.querySelector('#signal-export-data');embed.textContent=JSON.stringify(issues).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');clone.querySelector('#app').innerHTML='';const toastClone=clone.querySelector('#toast');toastClone.hidden=true;toastClone.textContent='';const result='<!DOCTYPE html>\n'+clone.outerHTML;download('index.html',result);toast('网页文件已生成：把这个文件替换 GitHub 仓库中的 index.html 并提交，即可更新公开网站')}
function wire(){if($('#menuToggle'))$('#menuToggle').onclick=()=>{let nav=$('#mobileNav');nav.classList.toggle('open');$('#menuToggle').setAttribute('aria-expanded',String(nav.classList.contains('open')))};document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{govRegion=b.dataset.region;route()});if($('#archiveSearch'))$('#archiveSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('#archiveResults').innerHTML=archiveCards(currentIssues().filter(i=>(i.date+' '+i.title+' '+i.markdown).toLowerCase().includes(q)))};if($('#shareIssue'))$('#shareIssue').onclick=async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:document.title,url});else if(navigator.clipboard)await navigator.clipboard.writeText(url);else throw new Error();toast('已打开分享或复制链接')}catch(e){if(e.name==='AbortError')return;toast('无法自动复制，可手动复制浏览器地址')}};if($('#previewBtn'))$('#previewBtn').onclick=()=>{syncEditor();editorPreview=true;route()};if($('#saveBtn'))$('#saveBtn').onclick=()=>{syncEditor();if(!/^\d{4}-\d{2}-\d{2}$/.test(editorState.date)||!editorState.markdown.trim()){toast('请填写正确日期并粘贴完整正文');return}issues=issues.filter(x=>x.date!==editorState.date);issues.unshift({...editorState,status:'published',updated_at:new Date().toISOString()});issues.sort((a,b)=>b.date.localeCompare(a.date));persist();toast('已保存本机：记得下载并重新部署网页');route()};if($('#exportBtn'))$('#exportBtn').onclick=exportHtml;if($('#backupBtn'))$('#backupBtn').onclick=()=>download('signal-issues-backup.json',JSON.stringify(issues,null,2),'application/json;charset=utf-8');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=issues.find(y=>y.date===b.dataset.edit);if(x){editorState={date:x.date,title:x.title,markdown:x.markdown,verified:x.verified};editorPreview=false;route();toast('已载入该刊期供编辑')}})}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
